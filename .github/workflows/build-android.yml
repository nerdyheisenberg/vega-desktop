name: "Build Android APK"

on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Configure Android NDK toolchain
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TOOLCHAIN/bin"

          echo "$BIN" >> $GITHUB_PATH

          for target in aarch64-linux-android armv7a-linux-androideabi; do
            ln -sf "$BIN/llvm-ranlib" "$BIN/${target}-ranlib"
            ln -sf "$BIN/llvm-ar" "$BIN/${target}-ar"
            ln -sf "$BIN/llvm-strip" "$BIN/${target}-strip"
          done

          echo "CC_aarch64_linux_android=${BIN}/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${BIN}/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=${BIN}/llvm-ranlib" >> $GITHUB_ENV

          echo "CC_armv7_linux_androideabi=${BIN}/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "AR_armv7_linux_androideabi=${BIN}/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_armv7_linux_androideabi=${BIN}/llvm-ranlib" >> $GITHUB_ENV

          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${BIN}/aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "${BIN}/armv7a-linux-androideabi21-clang"
          EOF

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VITE_TV_MODE: "true"
        run: npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Upload unsigned APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-tv-android-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
